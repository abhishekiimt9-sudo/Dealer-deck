<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dealer Order Support</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
         background:#eef2f7; height:100vh; display:flex; align-items:center; justify-content:center; }
  .hidden { display:none !important; }
  #login { background:#fff; padding:32px; border-radius:16px; width:360px;
           box-shadow:0 12px 40px rgba(0,0,0,.12); }
  #login h2 { margin:0 0 6px; font-size:20px; color:#1e293b; }
  #login p  { margin:0 0 22px; font-size:13px; color:#64748b; }
  #login input { width:100%; padding:11px 13px; margin-bottom:12px; border:1px solid #cbd5e1;
                 border-radius:9px; font-size:14px; outline:none; }
  #login input:focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  #login button { width:100%; padding:12px; background:#2563eb; color:#fff; border:0;
                  border-radius:9px; font-size:15px; font-weight:600; cursor:pointer; }
  #login button:hover { background:#1d4ed8; }
  #loginErr { color:#dc2626; font-size:13px; margin-top:8px; min-height:18px; }
  #chat { width:430px; height:92vh; max-height:760px; background:#fff; border-radius:16px;
          display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.12); }
  .chat-head { background:linear-gradient(135deg,#2563eb,#1e40af); color:#fff;
               padding:14px 18px; display:flex; align-items:center; gap:12px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.2);
            display:flex; align-items:center; justify-content:center; font-size:20px; }
  .chat-head h3 { margin:0; font-size:15px; }
  .chat-head small { opacity:.85; font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#4ade80; display:inline-block; margin-right:4px; }
  #messages { flex:1; overflow-y:auto; padding:18px; background:#f8fafc;
              display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:14px; font-size:13.5px;
         line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .msg.dealer { align-self:flex-end; background:#2563eb; color:#fff; border-bottom-right-radius:4px; }
  .msg.bot    { align-self:flex-start; background:#fff; color:#1e293b;
                border:1px solid #e2e8f0; border-bottom-left-radius:4px; }
  .msg.agent  { align-self:flex-start; background:#ecfdf5; color:#065f46;
                border:1px solid #a7f3d0; border-bottom-left-radius:4px; }
  .msg .meta { font-size:10px; opacity:.6; margin-top:6px; }
  .chips { padding:8px 14px 0; display:flex; gap:8px; flex-wrap:wrap; background:#f8fafc; }
  .chip { background:#fff; border:1px solid #cbd5e1; color:#334155; font-size:12px;
          padding:5px 11px; border-radius:20px; cursor:pointer; }
  .chip:hover { background:#2563eb; color:#fff; border-color:#2563eb; }
  .chat-input { display:flex; gap:8px; padding:12px; border-top:1px solid #e2e8f0; background:#fff; }
  .chat-input input { flex:1; padding:11px 14px; border:1px solid #cbd5e1; border-radius:22px;
                      font-size:14px; outline:none; }
  .chat-input input:focus { border-color:#2563eb; }
  .chat-input button { width:44px; height:44px; border-radius:50%; border:0; background:#2563eb;
                       color:#fff; font-size:18px; cursor:pointer; }
  .chat-input button:hover { background:#1d4ed8; }
  .typing { font-size:11px; color:#64748b; padding:0 18px 6px; height:14px; }
</style>
</head>
<body>

<div id="login">
  <h2>🏭 Dealer Order Support</h2>
  <p>Apna Dealer Code daal kar order status poochein</p>
  <input id="inpCode" placeholder="Dealer Code (e.g. D1001)" autocomplete="off" />
  <input id="inpName" placeholder="Dealer Name (optional)" autocomplete="off" />
  <button onclick="join()">Start Chat</button>
  <div id="loginErr"></div>
</div>

<div id="chat" class="hidden">
  <div class="chat-head">
    <div class="avatar">🤖</div>
    <div>
      <h3>Order Support Assistant</h3>
      <small><span class="dot"></span><span id="whoami">—</span></small>
    </div>
  </div>
  <div id="messages"></div>
  <div class="typing" id="typing"></div>
  <div class="chips">
    <div class="chip" onclick="quick('Mere saare recent orders ka status batao')">📋 Recent Orders</div>
    <div class="chip" onclick="quick('Mera order back order me hai, ETA batao')">⏳ Back Order ETA</div>
    <div class="chip" onclick="quick('agent')">💬 Talk to Agent</div>
  </div>
  <div class="chat-input">
    <input id="inpMsg" placeholder="PO number ya Part number likhein..." autocomplete="off"
           onkeydown="if(event.key==='Enter') send()" />
    <button onclick="send()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null, dealerCode = null;
function join() {
  const code = document.getElementById('inpCode').value.trim().toUpperCase();
  const name = document.getElementById('inpName').value.trim();
  if (!code) { document.getElementById('loginErr').textContent = 'Dealer Code zaroori hai'; return; }
  socket = io();
  socket.on('connect', () => {
    socket.emit('dealer:join', { dealerCode: code, dealerName: name }, (res) => {
      if (!res || !res.ok) {
        document.getElementById('loginErr').textContent = res?.error || 'Connection failed';
        return;
      }
      dealerCode = code;
      document.getElementById('login').classList.add('hidden');
      document.getElementById('chat').classList.remove('hidden');
      document.getElementById('whoami').textContent = code + (res.dealerName ? ' • ' + res.dealerName : '');
      document.getElementById('messages').innerHTML = '';
      if (res.history && res.history.length) res.history.forEach(addMessage);
      else addMessage({ sender:'bot', message:'Namaste! 🙏 Main aapka Order Support Assistant hoon.\n\n• PO number likh kar status poochein\n• Part number se bhi poochein\n• "agent" likhein live executive ke liye', created_at: new Date().toISOString() });
    });
  });
  socket.on('chat:message', addMessage);
  socket.on('bot:typing', (v) => document.getElementById('typing').textContent = v ? 'Assistant typing…' : '');
}
function send() {
  const inp = document.getElementById('inpMsg');
  const text = inp.value.trim();
  if (!text || !socket) return;
  inp.value = '';
  socket.emit('dealer:message', { text });
}
function quick(t) { document.getElementById('inpMsg').value = t; send(); }
function addMessage(m) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (m.sender === 'dealer' ? 'dealer' : m.sender === 'agent' ? 'agent' : 'bot');
  const label = m.sender === 'agent' ? '👨‍💼 Support: ' : '';
  div.textContent = label + m.message;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = new Date(m.created_at).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  div.appendChild(meta);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
