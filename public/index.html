  .hours-bar { background: #ecfdf5; color: #065f46; padding: 6px 12px; font-size: 10.5px;
    text-align: center; border-bottom: 1px solid #a7f3d0; font-weight: 500; }
  .hours-bar.closed { background: #fef3c7; color: #92400e; border-bottom-color: #fde68a; }

  .chat { flex: 1; overflow-y: auto; padding: 16px; background: #f4f6fb;
    display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bot { background: #fff; color: #1a1a1a; align-self: flex-start;

  .user { background: #b3001b; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot strong { color: #b3001b; }

  .chip.support { background: #b3001b; color: #fff; border-color: #b3001b; font-weight: 600; }
  .chip.support:hover { background: #7a0012; }
  .chip.faq { background: #f0f9ff; color: #0369a1; border-color: #bae6fd; }
  .chip.faq:hover { background: #0369a1; color: #fff; border-color: #0369a1; }

    display: flex; align-items: center; justify-content: center; }
  .send-btn:hover { background: #7a0012; }

  .typing { display: flex; gap: 4px; padding: 12px 16px; background: #fff;
    border-radius: 14px; align-self: flex-start; width: fit-content; }
  .typing span { width: 7px; height: 7px; background: #b3001b; border-radius: 50%;

  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 380px;

  .modal .modal-icon { width: 48px; height: 48px; border-radius: 50%; background: #fff5f6;

  .modal p { font-size: 12.5px; color: #666; text-align: center; margin-bottom: 16px; line-height: 1.5; }

  .modal input, .modal textarea { width: 100%; border: 1.5px solid #d7dbe6; border-radius: 10px;

let TICKETS = JSON.parse(localStorage.getItem(TICKETS_KEY) || 'null') || DEMO_TICKETS;
let FEEDBACK = JSON.parse(localStorage.getItem(FEEDBACK_KEY) || '[]');

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(ORDERS));
  localStorage.setItem(TICKETS_KEY, JSON.stringify(TICKETS));
  localStorage.setItem(FEEDBACK_KEY, JSON.stringify(FEEDBACK));
}

/* ============================================================
   SUPPORT THREAD HELPERS
   ============================================================ */
function getThreads() {
  return JSON.parse(localStorage.getItem(THREADS_KEY) || '{}');
}
function saveThreads(threads) {
  localStorage.setItem(THREADS_KEY, JSON.stringify(threads));
}
function ensureThread(dealerCode, dealerName) {
  const threads = getThreads();
  if (!threads[dealerCode]) {
    threads[dealerCode] = {
      dealerCode, dealerName,
      messages: [],
      status: 'open',
      lastUpdate: todayStamp(),
      unreadByAdmin: 0,
      unreadByDealer: 0
    };
    saveThreads(threads);
  }
  return threads[dealerCode];
}
function addThreadMessage(dealerCode, from, text, dealerName) {
  const threads = getThreads();
  if (!threads[dealerCode]) {
    threads[dealerCode] = { dealerCode, dealerName: dealerName || dealerCode,
      messages: [], status: 'open', lastUpdate: todayStamp(),
      unreadByAdmin: 0, unreadByDealer: 0 };
  }
  threads[dealerCode].messages.push({
    from, text, time: nowTime(), timestamp: Date.now()
  });
  threads[dealerCode].lastUpdate = todayStamp();
  threads[dealerCode].status = 'open';
  if (from === 'dealer') threads[dealerCode].unreadByAdmin = (threads[dealerCode].unreadByAdmin || 0) + 1;
  if (from === 'admin') threads[dealerCode].unreadByDealer = (threads[dealerCode].unreadByDealer || 0) + 1;
  saveThreads(threads);
}

/* ============================================================
   UTILITIES
   ============================================================ */
function nowTime() { return new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' }); }
function todayStamp() {
  const d = new Date();
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
    + ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}
function isWorkingHours() {
  const d = new Date();
  return d.getDay() !== 0 && d.getHours() >= 9 && d.getHours() < 19;
}
function updateHoursBar() {
  const bar = document.getElementById('hoursBar');
  if (isWorkingHours()) { bar.textContent = t('hoursOpen'); bar.classList.remove('closed'); }
  else { bar.textContent = t('hoursClosed'); bar.classList.add('closed'); }
}
function applyLanguage() {
  document.getElementById('hdrTitle').textContent = t('hdrTitle');
  document.getElementById('hdrSub').textContent = t('hdrSub');
  document.getElementById('userInput').placeholder = t('inputPlaceholder');
  document.getElementById('silentText').textContent = t('silentText');
  updateHoursBar();
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
}

function getUniqueDealers() {
  const map = {};
  ORDERS.forEach(o => {
    const code = o.dealerCode;
    const name = o.dealerName || code;
    if (!code) return;
    if (!map[code]) {
      map[code] = { code, name, orderCount: 0 };
    }
    if (o.orderNumber) map[code].orderCount++;
  });
  return Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
}

function getStatusBadge(status) {
  if (!status) return 'badge-pending';
  const s = status.toLowerCase();
  if (s.includes('deliver')) return 'badge-delivered';
  if (s.includes('transit')) return 'badge-transit';
  if (s.includes('dispatch')) return 'badge-dispatch';
  if (s.includes('hold')) return 'badge-hold';
  return 'badge-pending';
}
function closeModal() {
  modalOverlay.classList.remove('show'); currentModalType = null;
  modalInput.value = ''; modalTextarea.value = '';
}

});

modalTextarea.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); modalSubmit.click(); } });

modalSubmit.onclick = () => {
  const type = currentModalType;
  if (type === 'order') {
    const v = modalInput.value.trim(); if (!v) { modalInput.focus(); return; }
    closeModal(); handleMessage(v);
  } else if (type === 'query') {
    const v = modalTextarea.value.trim(); if (!v) { modalTextarea.focus(); return; }
    closeModal(); handleMessage(v);
  } else if (type === 'raise-ticket') {
    const o = (document.getElementById('tktOrder')?.value || '').trim();
    const p = (document.getElementById('tktPart')?.value || '').trim();
    const iss = (document.getElementById('tktIssue')?.value || '').trim();
    if (!iss) { document.getElementById('tktIssue').focus(); return; }
    const tn = 'TKT-' + new Date().getFullYear() + '-' + String(TICKETS.length + 1).padStart(4, '0');
    TICKETS.push({ ticketNumber: tn, dealerCode: authState.dealerCode, orderNumber: o,
      partNumber: p, issueDescription: iss, ticketStatus: 'Open',
      raisedDate: todayStamp(), closedDate: '', resolutionRemarks: '' });
    saveData(); closeModal();
    botReply(`${LANG === 'hi' ? 'सपोर्ट टिकट बनाया गया!' : 'Support ticket created!'}<br><br>
      <strong>${LANG === 'hi' ? 'टिकट नंबर' : 'Ticket Number'}:</strong> ${tn}<br>
      <strong>Status:</strong> Open<br>
      <strong>${LANG === 'hi' ? 'दिनांक' : 'Raised On'}:</strong> ${todayStamp()}`);
  }
};

function getProgressBar(status) {
  const stages = ['Received','Processing','Dispatched','In Transit','Delivered'];
  const map = { 'Order Received':0, 'Processing':1, 'Pending Dispatch':1, 'Partially Dispatched':2,
    'Fully Dispatched':2, 'In Transit':3, 'Delivered':4, 'On Hold':1, 'Cancelled':0 };
  const active = map[status] !== undefined ? map[status] : 1;
  return `<div class="progress-track">${stages.map((_, i) =>
    `<div class="progress-step ${i < active ? 'done' : i === active ? 'active' : ''}"></div>`).join('')}</div>
    <div style="font-size:10px;color:#888;text-align:center">${status}</div>`;
}

function findOrders(q) {
  const s = q.trim().toUpperCase();
  return ORDERS.filter(o => o.orderNumber &&
    (String(o.orderNumber).toUpperCase() === s ||
     String(o.partNumber || '').toUpperCase() === s ||
     String(o.dealerCode).toUpperCase() === s));
}

function requestSupportTeam() {
  if (authState.supportRequested) return;
  authState.supportRequested = true;
  authState.silentMode = true;
  ensureThread(authState.dealerCode, authState.dealerName);
  addThreadMessage(authState.dealerCode, 'dealer',
    'REQUEST: Talk to Dealer Support Team', authState.dealerName);
  const isHi = LANG === 'hi';
  if (isWorkingHours()) {
    addMsg(isHi
      ? `<strong>डीलर सपोर्ट टीम</strong> को अनुरोध भेजा गया।<br><br>टीम जल्द संपर्क करेगी। नीचे अपना संदेश टाइप कर सकते हैं।`
      : `Request sent to <strong>Dealer Support Team</strong>.<br><br>Our team will connect with you shortly. You can continue typing your message below.`, 'bot');
  } else {
    addMsg(isHi
      ? `<strong>डीलर सपोर्ट टीम</strong> के लिए अनुरोध दर्ज।<br><br>टीम अभी ऑफलाइन है। सपोर्ट समय: 9AM-7PM (सोम-शनि)। संदेश छोड़ें।`
      : `Request recorded for <strong>Dealer Support Team</strong>.<br><br>Team is currently offline. Support: 9AM-7PM (Mon-Sat). Leave your message below.`, 'bot');
  }
  silentBanner.style.display = 'block';
  chips.innerHTML = '';
}

function handleMessage(text) {
  addMsg(text, 'user');

  if (authState.silentMode) {
    if (authState.dealerCode) {
      addThreadMessage(authState.dealerCode, 'dealer', text, authState.dealerName);
    }
    return;
  }

  const msg = text.toLowerCase().trim();
  const isHi = LANG === 'hi';

  if (/talk to (agent|support|team|dealer support)|connect.*support|support.*team|सपोर्ट.*बात/.test(msg)) {
    requestSupportTeam(); return;
  }
  if (/^(hi|hello|hey|namaste|नमस्ते)/.test(msg)) {
    botReply(`${t('welcome')}<br><br>${t('enterCode')}`);
    openDealerSelectModal();
    return;
  }

  if (!authState.dealerCode) {
    const code = text.trim().toUpperCase();
    const exists = ORDERS.some(o => String(o.dealerCode).toUpperCase() === code);
    if (exists) {
      const dealer = ORDERS.find(o => String(o.dealerCode).toUpperCase() === code);
      loginDealer(dealer.dealerCode, dealer.dealerName);
    } else {
      botReply(t('notFound'));
      setTimeout(openDealerSelectModal, 1200);
    }
    return;
  }

  if (/logout|switch dealer|change dealer|लॉग आउट/.test(msg)) {
    clearChat(); authState.dealerCode = null; authState.dealerName = null;
    botReply(t('loggedOut'));
    setTimeout(openDealerSelectModal, 800);
    return;
  }

  const found = findOrders(text);
  if (found.length === 1) {
    authState.lastOrderContext = found[0];
    botReply((isHi ? 'उपलब्ध विवरण:' : 'Here are the available details:') + '<br><br>' + orderCard(found[0]));
    setTimeout(attachFeedbackHandlers, 900); return;
  }
  if (found.length > 1) {
    botReply((isHi ? 'कई ऑर्डर मिले:' : 'Multiple orders found:') + '<br><br>' +
      found.map((o,i) => `${i+1}. ${o.orderNumber} - ${o.partDescription || ''}`).join('<br>')); return;
  }

  if (/delay|late|why.*not|pending|देरी|क्यों/.test(msg)) {
    const o = authState.lastOrderContext;
    if (!o) { botReply(isHi ? 'कृपया ऑर्डर नंबर दें।' : 'Please share the Order Number.'); return; }
    if (o.holdReason) {
      botReply(`${isHi ? 'ऑर्डर' : 'Order'} <strong>${o.orderNumber}</strong> ${isHi ? 'होल्ड पर है।' : 'is on hold.'}<br><br>
        <strong>${isHi ? 'कारण' : 'Reason'}:</strong> ${o.holdReason}
        <div class="updated">${isHi ? 'अंतिम अपडेट' : 'Last Updated'}: ${o.lastUpdated}</div>`);
    } else {
      botReply(`${isHi ? 'ऑर्डर' : 'Order'} <strong>${o.orderNumber}</strong> ${isHi ? 'की स्थिति' : 'is'} <strong>${o.orderStatus || 'N/A'}</strong>.<br><br>
        ${isHi ? 'कोई पुष्ट कारण नहीं। सपोर्ट टीम से संपर्क करें।' : 'No confirmed reason. Contact support.'}`);
    }
    return;
  }

  if (/dispatch|docket|transporter|lr number|डिस्पैच/.test(msg)) {
    const o = authState.lastOrderContext;
    if (!o) { botReply(isHi ? 'कृपया ऑर्डर नंबर दें।' : 'Please share the Order Number.'); return; }
    if ((o.dispatchedQty || 0) > 0) {
      botReply(`${isHi ? 'डिस्पैच विवरण' : 'Dispatch details'} - <strong>${o.orderNumber}</strong>:<br><br>
        &bull; ${isHi ? 'मात्रा' : 'Qty'}: ${o.dispatchedQty}<br>
        &bull; ${isHi ? 'दिनांक' : 'Date'}: ${o.dispatchDate || '-'}<br>
        &bull; Docket/LR: ${o.docketLR || '-'}<br>
        &bull; ${isHi ? 'ट्रांसपोर्टर' : 'Transporter'}: ${o.transporter || '-'}
        <div class="updated">${isHi ? 'अंतिम अपडेट' : 'Last Updated'}: ${o.lastUpdated}</div>`);
    } else {
      botReply(`${isHi ? 'डिस्पैच नहीं हुआ।' : 'Not dispatched yet.'}<br>
        ${isHi ? 'स्थिति' : 'Status'}: <strong>${o.orderStatus || 'N/A'}</strong><br>
        ETA: ${o.eta || (isHi ? 'अभी उपलब्ध नहीं' : 'Currently not available')}`);
    }
    return;
  }

  if (/eta|availability|available|उपलब्ध/.test(msg)) {
    const o = authState.lastOrderContext;
    if (!o) { botReply(isHi ? 'कृपया ऑर्डर या पार्ट नंबर दें।' : 'Please share Order or Part Number.'); return; }
    botReply(`<strong>${o.partNumber || '-'}</strong> (${o.partDescription || '-'}):<br><br>
      &bull; ${isHi ? 'स्टॉक' : 'Stock'}: <strong>${o.stockAvailability || '-'}</strong><br>
      &bull; ETA: <strong>${o.eta || (isHi ? 'अभी उपलब्ध नहीं' : 'Currently not available')}</strong>
      <div class="updated">${isHi ? 'अंतिम अपडेट' : 'Last Updated'}: ${o.lastUpdated}</div>`);
    return;
  }

  botReply(isHi
    ? `"<strong>${text}</strong>" से मेल खाता कुछ नहीं मिला।<br><br>कृपया ऑर्डर नंबर, डीलर कोड या पार्ट नंबर जाँचें।`
    : `Could not find a match for "<strong>${text}</strong>".<br><br>Please verify the Order Number, Dealer Code, or Part Number.`);
}

function renderMainChips() {
  const c = I18N[LANG].chips;
  renderChips([c.myOrders, c.orderStatus, c.raiseTicket, c.trackTicket, c.faq, c.otherQuery, c.support]);
}

function renderChips(list) {
  chips.innerHTML = '';
  list.forEach(c => {
    const b = document.createElement('div');
    b.className = 'chip';
    const c_ = I18N[LANG].chips;
    if (c === c_.support) b.classList.add('support');
    if (c === c_.faq) b.classList.add('faq');
    b.textContent = c;
    b.onclick = () => {
      const cc = I18N[LANG].chips;
      if (c === cc.orderStatus) openModal('order');
      else if (c === cc.otherQuery) openModal('query');
      else if (c === cc.myOrders) openModal('my-orders');
      else if (c === cc.raiseTicket) openModal('raise-ticket');
      else if (c === cc.trackTicket) openModal('track-ticket');
      else if (c === cc.faq) openModal('faq');
      else if (c === cc.support) requestSupportTeam();
      else if (c === cc.dispatch || c === cc.eta) {
        if (authState.lastOrderContext) { input.value = c; send(); }
        else openModal('order');
      } else { input.value = c; send(); }
    };
    chips.appendChild(b);
  });
}

function send() {
  const v = input.value.trim(); if (!v) return;
  input.value = ''; handleMessage(v);
}
sendBtn.onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

document.querySelectorAll('.lang-btn').forEach(b => {
  b.onclick = () => {
    LANG = b.dataset.lang;
    localStorage.setItem('mg_lang', LANG);
    applyLanguage();
    if (!authState.dealerCode) {
      chat.innerHTML = '';
      addMsg(`${t('welcome')}<br><br>${t('enterCode')}`);
      openDealerSelectModal();
    } else { renderMainChips(); }
  };
});

/* Poll for admin replies */
setInterval(() => {
  if (!authState.silentMode || !authState.dealerCode) return;
  const threads = getThreads();
  const thread = threads[authState.dealerCode];
  if (!thread || !thread.messages) return;
  const adminMsgs = thread.messages.filter(m => m.from === 'admin');
  const seen = adminMsgSeen[authState.dealerCode] || 0;
  if (adminMsgs.length > seen) {
    adminMsgs.slice(seen).forEach(m => {
      addMsg(`<strong style="color:#16a34a">🛡️ Dealer Support Team:</strong><br>${m.text}`,
        'bot', true, true);
    });
    adminMsgSeen[authState.dealerCode] = adminMsgs.length;
    const th = getThreads();
    if (th[authState.dealerCode]) {
      th[authState.dealerCode].unreadByDealer = 0;
      saveThreads(th);
    }
  }
}, 1500);

/* ============================================================
   BOOT
   ============================================================ */
applyLanguage();
setInterval(updateHoursBar, 60000);
addMsg(`${t('welcome')}<br><br>${t('enterCode')}`);
setTimeout(() => { openDealerSelectModal(); }, 500);
</script>
</body>
</html>
